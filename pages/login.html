<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión PawnShare</title>

    <!-- TODO: Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!--TODO:  Google Fonts: Onest -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- TODO: CSS personalizado -->
    <link rel="stylesheet" href="../assets/css/pages/login.css" />
    <link rel="stylesheet" href="../assets/css/base/paleta.css" />
  </head>

  <body>
    <!-- HEADER-->
    <header class="header-pawnshare"></header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <!-- LOGO PawnShare-->
      <div class="logo-container">
        <a class="logo-link">
          <img
            src="../assets/img/icons/login/mode-clear/Icon-pawnShare-clear.svg"
            alt="Logo de pawnshare"
            class="logo-img"
          />
        </a>
      </div>

      <!-- TODO: TARJETA DE LOGIN -->
      <div class="login-card">
        <h2 class="form-title mb-4">Inicio de Sesión</h2>

        <form id="loginForm" action="" novalidate>
          <!-- Campo: Correo -->
          <div class="mb-3">
            <div class="input-group-custom">
              <img
                src="../assets/img/icons/login/mode-clear/icon-email.svg"
                alt="Email"
                class="input-icon"
              />
              <input
                type="email"
                class="form-control custom-input"
                id="email"
                placeholder="Ingresa tu correo electrónico"
                required
              />
            </div>
            <div id="emailError" class="text-danger small mt-1"></div>
          </div>

          <!-- Campo: Contraseña -->
          <div class="mb-3">
            <div class="input-group-custom">
              <img
                src="../assets/img/icons/login/mode-clear/icon-Lock.svg"
                alt="Password"
                class="input-icon"
              />
              <input
                type="password"
                class="form-control custom-input"
                id="password"
                placeholder="Ingresa tu contraseña"
                required
              />
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Mostrar u ocultar contraseña"
              >
                <img
                  src="../assets/img/icons/login/mode-clear/icon-eye-off.svg"
                  alt="Mostrar contraseña"
                  id="toggleIcon"
                  class="toggle-icon"
                />
              </button>
            </div>
            <div id="passwordError" class="text-danger small mt-1"></div>
          </div>

          <div id="alert-container" class="mb-3"></div>
          <!-- TODO:  Error general-->
          <div id="loginError" class="d-none mb-3" role="alert"></div>

          <!-- ¿Olvidaste tu contraseña? -->
          <div class="mb-4 text-start">
            <a class="forgot-link" href="./recuperarContrasena.html"
              >¿Olvidaste tu contraseña?</a
            >
          </div>

          <!-- Botón Ingresar -->
          <div class="d-grid gap-2 mb-3">
            <button type="submit" class="btn custom-btn">Ingresar</button>
          </div>

          <!-- ¿No tienes cuenta? -->
          <p class="register-text text-center mb-0">
            ¿No tienes cuenta?,
            <a href="#" id="registerLink" class="register-link"
              >regístrate ahora</a
            >
          </p>
        </form>
      </div>

      <!-- TODO: Regresar a la página principal -->
      <div class="back-container">
        <a href="../index.html" class="back-link">
          <img
            src="../assets/img/icons/login/mode-clear/icon-arrow-clear.svg"
            alt="Arrow"
            class="back-icon"
          />
          Regresar a la página principal
        </a>
      </div>
    </main>

    <!-- TODO: Decoración: Hongos-->
    <img
      src="../assets/img/icons/hongo-izquierda.svg"
      alt=""
      class="hongo hongo-izquierda"
    />
    <img
      src="../assets/img/icons/hongo-derecha.svg"
      alt=""
      class="hongo hongo-derecha"
    />

    <!-- TODO: Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/pages/login.js"></script>
  </body>
</html>
