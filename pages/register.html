<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar PawnShare</title>

    <!--TODO: Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!--TODO: Flatpickr CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />

    <!--TODO: Google Fonts: Onest -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--TODO: CSS personalizado -->
    <link rel="stylesheet" href="../assets/css/base/paleta.css" />
    <link rel="stylesheet" href="../assets/css/pages/register.css" />
  </head>

  <body>
    <!--TODO: HEADER -->
    <header class="header-pawnshare"></header>

    <!--* CONTENEDOR PRINCIPAL -->
    <main class="main-registro">
      <!-- Grid de Bootstrap -->
      <div class="container-fluid h-100">
        <div class="row h-100 align-items-center">
          <!--* LADO IZQUIERDO: Textos -->
          <div
            class="col-12 col-md-7 col-lg-6 ps-4 ps-md-5 mb-4 mb-md-0 text-center text-md-start"
          >
            <h1 class="texto-titulo">¡Domina el tablero!</h1>
            <p class="texto-subtitulo">
              Analiza jugadas de Grandes Maestros, comparte
              <br class="d-none d-lg-block" />
              tus mejores tácticas y evoluciona con la comunidad.
            </p>
          </div>

          <!--* LADO DERECHO: Formulario -->
          <div class="col-12 col-md-5 col-lg-6 contenedor-formulario">
            <!-- La caja con el fondo -->
            <div class="caja-formulario w-100">
              <!-- LOGO -->
              <div class="logo-contenedor">
                <img
                  src="../assets/img/icons/mode-clear/icon-pawnShare.svg"
                  alt="PawnShare Logo"
                  class="logo-img"
                />
              </div>

              <!--* FORMULARIO -->
              <form class="formulario-registro">
                <!--  Contenedor para las alertas de Bootstrap -->
                <div id="alert-container" class="mb-3"></div>
                <!-- Campo: Nombre -->
                <div class="mb-3">
                  <label for="nombre" class="form-label"
                    >Nombre de Usuario:</label
                  >
                  <div class="input-wrapper">
                    <img
                      src="../assets/img/icons/mode-clear/icon-user.svg"
                      alt="user"
                      class="input-icon"
                    />
                    <input
                      type="text"
                      class="form-control custom-input w-100"
                      id="nombre"
                      placeholder="Ingresa tu nombre de usuario"
                    />
                  </div>
                </div>

                <!-- Campo: Correo -->
                <div class="mb-3">
                  <label for="correo" class="form-label"
                    >Ingresa tu correo electrónico:</label
                  >
                  <div class="input-wrapper">
                    <img
                      src="../assets/img/icons/mode-clear/icon-email.svg"
                      alt="email"
                      class="input-icon"
                    />
                    <input
                      type="email"
                      class="form-control custom-input w-100"
                      id="correo"
                      placeholder="Ingresa tu correo"
                    />
                  </div>
                </div>

                <!-- Campo: Fecha -->
                <div class="mb-3">
                  <label for="fecha" class="form-label"
                    >Ingresa tu fecha de Nacimiento:</label
                  >
                  <div class="input-wrapper">
                    <img
                      src="../assets/img/icons/mode-clear/icon-calendar.svg"
                      alt="calendar"
                      class="input-icon"
                    />
                    <!-- El input con el id "fecha" -->
                    <input
                      type="date"
                      class="form-control custom-input w-100"
                      id="fecha"
                      placeholder="dd/mm/aaaa"
                    />
                  </div>
                </div>

                <!-- Campo: Contraseña -->
                <div class="mb-3">
                  <label for="pass" class="form-label"
                    >Establece tu contraseña:</label
                  >
                  <div class="input-wrapper">
                    <img
                      src="../assets/img/icons/mode-clear/icon-Lock.svg"
                      alt="lock"
                      class="input-icon"
                    />
                    <input
                      type="password"
                      class="form-control custom-input w-100"
                      id="pass"
                      placeholder="Captura tu contraseña"
                    />
                    <button type="button" class="toggle-password">
                      <img
                        src="../assets/img/icons/mode-clear/icon-eye-off.svg"
                        alt="ver"
                        class="toggle-icon"
                      />
                    </button>
                  </div>
                </div>

                <!-- Campo: Confirmar Contraseña -->
                <div class="mb-4">
                  <label for="confirm-pass" class="form-label"
                    >Confirma tu contraseña:</label
                  >
                  <div class="input-wrapper">
                    <img
                      src="../assets/img/icons/mode-clear/icon-Lock.svg"
                      alt="lock"
                      class="input-icon"
                    />
                    <input
                      type="password"
                      class="form-control custom-input w-100"
                      id="confirm-pass"
                      placeholder="Confirma tu contraseña"
                    />
                    <button type="button" class="toggle-password">
                      <img
                        src="../assets/img/icons/mode-clear/icon-eye-off.svg"
                        alt="ver"
                        class="toggle-icon"
                      />
                    </button>
                  </div>
                </div>

                <!--* Requisitos -->
                <div class="requisitos-contenedor mb-4">
                  <h3 class="requisitos-titulo">Requisitos de contraseña:</h3>
                  <ul class="lista-requisitos">
                    <li id="req-mayuscula">
                      <span class="circulo"></span> Una letra mayúscula (A-Z)
                    </li>
                    <li id="req-minuscula">
                      <span class="circulo"></span> Una letra minúscula (a-z)
                    </li>
                    <li id="req-numero">
                      <span class="circulo"></span> Un número (0-9)
                    </li>
                    <li id="req-especial">
                      <span class="circulo"></span> Un carácter especial
                      (!@#$%&*)
                    </li>
                  </ul>
                </div>

                <!-- Botón -->
                <div class="d-flex justify-content-center mt-2 mb-3">
                  <button type="submit" class="custom-btn btn-registro">
                    Crear mi cuenta
                  </button>
                </div>

                <!-- Footer del form -->
                <p class="texto-footer-form">
                  ¿Ya tienes cuenta?
                  <a href="./login.html" class="link-login">Ingresa aquí</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!--TODO: Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <!--TODO: Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/pages/register.js"></script>
  </body>
</html>
